name: BrahmaConnect
options:
  bundleIdPrefix: com.brahma
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"

targets:
  BrahmaConnect:
    type: application
    platform: iOS
    sources:
      - path: BrahmaConnect
      # Reuse the Android app's holographic WebGL background as-is.
      - path: ../brahma-connect-android/app/src/main/assets/web_background
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.brahma.connect
        PRODUCT_NAME: BrahmaConnect
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: BrahmaConnect/Info.plist
        CODE_SIGN_STYLE: Automatic
